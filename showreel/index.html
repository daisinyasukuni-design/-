<script>
'use strict';
/* ==========================================================================

/* ---------- math ---------- */

const norm3 = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

    cz * cy, cz * sy * sx - sz * cx, cz * sy * cx + sz * sx,

}
const mulM = (m, v) => [m[0] * v[0] + m[1] * v[1] + m[2] * v[2], m[3] * v[0] + m[4] * v[1] + m[5] * v[2], m[6] * v[0] + m[7] * v[1] + m[8] * v[2]];

/* ---------- canvases ---------- */
let S = 1;                                   // device pixels per logical pixel
const cv = document.getElementById('c');
let out = cv.getContext('2d');
const scene = document.createElement('canvas'); let ctx;
const bloomC = document.createElement('canvas'); let bctx;
const LQ = { c1: document.createElement('canvas'), c2: document.createElement('canvas'), c3: document.createElement('canvas') };
const tmp = document.createElement('canvas').getContext('2d');
let grainPat = null, vignette = null;

function setupCanvases(scale) {
  S = scale;
  cv.width = scene.width = W * S; cv.height = scene.height = H * S;
  out = cv.getContext('2d'); ctx = scene.getContext('2d');
  bloomC.width = W * S / 4; bloomC.height = H * S / 4; bctx = bloomC.getContext('2d');
  for (const k of ['c1', 'c2', 'c3']) { LQ[k].width = W * S / 2; LQ[k].height = H * S / 2; LQ['x' + k.slice(1)] = LQ[k].getContext('2d'); }
  const g = document.createElement('canvas'); g.width = g.height = 256; const gx = g.getContext('2d');
  const id = gx.createImageData(256, 256), R = mulberry(5);
  for (let i = 0; i < id.data.length; i += 4) { const v = R() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gx.putImageData(id, 0, 0); grainPat = out.createPattern(g, 'repeat');
  vignette = out.createRadialGradient(W * S / 2, H * S / 2, H * S * 0.35, W * S / 2, H * S / 2, W * S * 0.62);
  vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,0.55)');
  if (ready) initScale();
}

/* ---------- type ---------- */
function setF(c, w, size, fam = DISP) { c.font = `${w} ${size}px ${fam}`; }
const layCache = new Map();
function layout(str, w, size, fam = DISP) {
  const key = w + '|' + size + '|' + fam + '|' + str;
  let L = layCache.get(key); if (L) return L;
  setF(tmp, w, size, fam);
  const chars = [];
  for (let i = 0; i < str.length; i++) chars.push({ ch: str[i], x: tmp.measureText(str.slice(0, i)).width, w: tmp.measureText(str[i]).width });
  const cap = tmp.measureText('H').actualBoundingBoxAscent;
  L = { str, chars, width: tmp.measureText(str).width, cap, size, w, fam };
  layCache.set(key, L); return L;
}
const lw = (L, tr) => L.width + tr * (L.chars.length - 1);  // tracked width
function drawL(c, L, x, y, fill, tr = 0) {
  setF(c, L.w, L.size, L.fam); c.fillStyle = fill;
  for (let i = 0; i < L.chars.length; i++) c.fillText(L.chars[i].ch, x + L.chars[i].x + i * tr, y);
}
function text(c, str, x, y, o = {}) {
  const L = layout(str, o.w || 500, o.size || 14, o.fam || MONO);
  const tr = (o.track || 0) * L.size, wd = lw(L, tr);
  const x0 = o.align === 'right' ? x - wd : o.align === 'center' ? x - wd / 2 : x;
  drawL(c, L, x0, y, o.color || PAPER_H, tr); return wd;
}
const typeOn = (s, p) => s.slice(0, Math.floor(s.length * clamp(p) + 0.001));
function samplePoints(draw, step) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true }); x.fillStyle = '#fff'; draw(x);
  const d = x.getImageData(0, 0, W, H).data, pts = [];
  for (let y = step >> 1; y < H; y += step) for (let xx = step >> 1; xx < W; xx += step) if (d[(y * W + xx) * 4 + 3] > 127) pts.push([xx, y]);
  return pts;
}

/* ---------- 3D helpers ---------- */
const FOC = 900, NEAR = 30;
function camProj(cam) {
  const cr = Math.cos(cam.roll || 0), sr = Math.sin(cam.roll || 0);
  return (x, y, z) => {
    const X = x - cam.x, Y = y - cam.y, Z = z - cam.z; if (Z < NEAR) return null;
    const k = FOC / Z; return [W / 2 + (X * cr - Y * sr) * k, H / 2 + (X * sr + Y * cr) * k, k, Z];
  };
}
function fixWinding(m) {
  m.f = m.f.map(f => {
    const a = m.v[f[0]], b = m.v[f[1]], c = m.v[f[2]];
    const n = cross3([b[0] - a[0], b[1] - a[1], b[2] - a[2]], [c[0] - a[0], c[1] - a[1], c[2] - a[2]]);
    const cen = f.reduce((s, i) => [s[0] + m.v[i][0], s[1] + m.v[i][1], s[2] + m.v[i][2]], [0, 0, 0]);

}
const PHI = (1 + Math.sqrt(5)) / 2;
const MESH = {
  cube: fixWinding({ v: [...Array(8)].map((_, i) => [(i & 1 ? 1 : -1) * .78, (i & 2 ? 1 : -1) * .78, (i & 4 ? 1 : -1) * .78]), f: [[0, 2, 6, 4], [1, 3, 7, 5], [0, 1, 5, 4], [2, 3, 7, 6], [0, 1, 3, 2], [4, 5, 7, 6]] }),
  octa: fixWinding({ v: [[1.2, 0, 0], [-1.2, 0, 0], [0, 1.2, 0], [0, -1.2, 0], [0, 0, 1.2], [0, 0, -1.2]], f: [[0, 2, 4], [2, 1, 4], [1, 3, 4], [3, 0, 4], [2, 0, 5], [1, 2, 5], [3, 1, 5], [0, 3, 5]] }),
  ico: fixWinding({ v: [[-1, PHI, 0], [1, PHI, 0], [-1, -PHI, 0], [1, -PHI, 0], [0, -1, PHI], [0, 1, PHI], [0, -1, -PHI], [0, 1, -PHI], [PHI, 0, -1], [PHI, 0, 1], [-PHI, 0, -1], [-PHI, 0, 1]].map(v => norm3(v)), f: [[0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11], [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8], [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9], [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]] }),
};
const LKEY = norm3([-0.45, -0.8, -0.5]), LRIM = norm3([0.85, 0.05, 0.5]), LLOW = [0, 1, 0];
function shadeFace(n, base = PAPER) {
  const d1 = Math.max(0, dot3(n, LKEY)), d2 = Math.max(0, dot3(n, LRIM)), d3 = Math.max(0, dot3(n, LLOW));
  return [10 + base[0] * d1 * .86 + BLUE[0] * d2 * .8 + ORANGE[0] * d3 * .3, 10 + base[1] * d1 * .86 + BLUE[1] * d2 * .8 + ORANGE[1] * d3 * .3, 12 + base[2] * d1 * .86 + BLUE[2] * d2 * .8 + ORANGE[2] * d3 * .3];
}
function drawPoly(c, mesh, o, w, cam, t) {
  const m = rotMat(o.rot[0] + o.spin[0] * t, o.rot[1] + o.spin[1] * t, o.rot[2] + o.spin[2] * t);
  const cr = Math.cos(cam.roll || 0), sr = Math.sin(cam.roll || 0);
  const vs = [];
  for (const v of mesh.v) {
    const r = mulM(m, v); const x = r[0] * o.r + w[0] - cam.x, y = r[1] * o.r + w[1] - cam.y, z = r[2] * o.r + w[2] - cam.z;
    if (z < NEAR) return; vs.push([x * cr - y * sr, x * sr + y * cr, z]);
  }
  const faces = [];
  for (const f of mesh.f) {
    const a = vs[f[0]], b = vs[f[1]], cc = vs[f[2]];
    const n = norm3(cross3([b[0] - a[0], b[1] - a[1], b[2] - a[2]], [cc[0] - a[0], cc[1] - a[1], cc[2] - a[2]]));

  g.addColorStop(.57, '#15151a'); g.addColorStop(.74, '#6a2a12'); g.addColorStop(.86, '#ff6a2c'); g.addColorStop(1, '#1a0c06');

  c.beginPath(); c.arc(x, y, R * .98, -0.9, 0.9); c.stroke();
  if (glow > 0) { c.fillStyle = rgba(PAPER, glow); c.fillRect(x - R, y - R, R * 2, R * 2); }

function drawGlass(c, x, y, R) {

  g.addColorStop(0, 'rgba(150,170,255,0.02)'); g.addColorStop(.82, 'rgba(150,170,255,0.09)'); g.addColorStop(1, 'rgba(255,255,255,0.26)');

  c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = Math.max(1, R * .045); c.lineCap = 'round';

function drawSlab(c, o, w, cam, t) {
  const m = rotMat(o.rot[0] + o.spin[0] * t, o.rot[1] + o.spin[1] * t, o.rot[2] + o.spin[2] * t);
  const P = camProj(cam), pts = [];

    const r = mulM(m, v); const p = P(r[0] * o.r + w[0], r[1] * o.r + w[1], r[2] * o.r + w[2]); if (!p) return; pts.push(p);

/* Perspective grid (tunnel, floor), depth-binned for atmospheric fade. */
function drawGrid(c, cam, mode, alpha, col = PAPER) {

  const bins = Array.from({ length: NB }, () => new Path2D()), acc = new Path2D();
  const P = camProj(cam);
  const seg = (a, b, accent) => {
    let za = a[2] - cam.z, zb = b[2] - cam.z;
