<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="'Yu Gothic UI','Meiryo','IPAGothic',sans-serif">
<rect width="1600" height="1000" fill="#d9dfe4"/>
<rect x="20" y="20" width="1560" height="960" rx="36" fill="#23272b"/>
<rect x="56" y="56" width="1488" height="888" rx="8" fill="#f4f6f8"/>
<rect x="56" y="56" width="1488" height="64" fill="#b3261e"/><text x="84" y="99" font-size="26" fill="#fff" text-anchor="start" font-weight="bold">危険体験モード　シナリオ1　チャックハンドルの置き忘れ</text><text x="1516" y="96" font-size="18" fill="#ffd9d5" text-anchor="end" font-weight="normal">演出の強さ：弱</text>
<rect x="80" y="140" width="860" height="640" rx="8" fill="#fff" stroke="#d5dbe0"/>
<rect x="80" y="140" width="860" height="640" rx="8" fill="#b3261e" opacity="0.06"/>
<text x="100" y="176" font-size="18" fill="#5b6670" text-anchor="start" font-weight="normal">チャックを正面から見た図</text>
<circle cx="420" cy="470" r="200" fill="#9aa4ac" stroke="#6b757d" stroke-width="4"/>
<g transform="translate(420.0,580.0) rotate(180)"><rect x="-26" y="-50" width="52" height="100" rx="6" fill="#5b656d"/></g>
<g transform="translate(324.7,415.0) rotate(300)"><rect x="-26" y="-50" width="52" height="100" rx="6" fill="#5b656d"/></g>
<g transform="translate(515.3,415.0) rotate(420)"><rect x="-26" y="-50" width="52" height="100" rx="6" fill="#5b656d"/></g>
<circle cx="420" cy="470" r="58" fill="#c3c9cf" stroke="#8a949c" stroke-width="3"/>
<path d="M300,240 a 240 240 0 0 1 200,-10" fill="none" stroke="#1f6fb2" stroke-width="5" marker-end="url(#ar)"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker></defs>
<text x="390" y="190" font-size="18" fill="#1f6fb2" text-anchor="middle" font-weight="normal">回転</text>
<rect x="570" y="460" width="22" height="22" fill="#2b2f33"/>
<g transform="translate(760,250) rotate(-30)"><rect x="-80" y="-12" width="160" height="24" rx="10" fill="#2b2f33"/><rect x="-12" y="-12" width="24" height="110" rx="6" fill="#2b2f33"/></g>
<line x1="600" y1="420" x2="690" y2="330" stroke="#b3261e" stroke-width="5" stroke-linecap="round"/>
<line x1="590" y1="380" x2="660" y2="300" stroke="#b3261e" stroke-width="5" stroke-linecap="round"/>
<line x1="630" y1="450" x2="720" y2="380" stroke="#b3261e" stroke-width="5" stroke-linecap="round"/>
<line x1="650" y1="300" x2="700" y2="250" stroke="#b3261e" stroke-width="5" stroke-linecap="round"/>
<polygon points="610,410 640,370 650,400 690,380 665,420 700,440 655,445 650,480 625,450 590,465 605,435 575,420" fill="#f2c200" stroke="#b3261e" stroke-width="3"/>
<text x="790" y="380" font-size="24" fill="#b3261e" text-anchor="middle" font-weight="bold">ハンドルが</text><text x="790" y="412" font-size="30" fill="#b3261e" text-anchor="middle" font-weight="bold">飛んだ！</text>
<rect x="100" y="700" width="820" height="64" rx="8" fill="#b3261e"/><text x="510" y="742" font-size="26" fill="#fff" text-anchor="middle" font-weight="bold">主軸が止まりました（シミュレーション）</text>
<rect x="700" y="560" width="220" height="110" rx="8" fill="#fbe5e3"/><text x="716" y="596" font-size="18" fill="#b3261e" text-anchor="start" font-weight="normal">🔊 衝撃音「ガン」</text><text x="716" y="628" font-size="18" fill="#b3261e" text-anchor="start" font-weight="normal">〰 振動：一発の衝撃</text><text x="716" y="656" font-size="16" fill="#b3261e" text-anchor="start" font-weight="normal">（全ハンドル）</text>
<rect x="960" y="140" width="560" height="640" rx="8" fill="#fff" stroke="#d5dbe0"/>
<text x="984" y="186" font-size="26" fill="#b3261e" text-anchor="start" font-weight="bold">何が起きたか</text>
<text x="984" y="226" font-size="20" fill="#1d2329" text-anchor="start" font-weight="normal">チャックハンドルを差したまま、主軸を</text>
<text x="984" y="258" font-size="20" fill="#1d2329" text-anchor="start" font-weight="normal">起動しました。ハンドルはチャックと一緒に</text>
<text x="984" y="290" font-size="20" fill="#1d2329" text-anchor="start" font-weight="normal">回り、勢いよく飛び出しました。</text>
<text x="984" y="322" font-size="20" fill="#1d2329" text-anchor="start" font-weight="normal">実機では、顔や体に当たる大けがに</text>
<text x="984" y="354" font-size="20" fill="#1d2329" text-anchor="start" font-weight="normal">つながります。</text>
<line x1="984" y1="400" x2="1496" y2="400" stroke="#d5dbe0" stroke-width="2"/>
<text x="984" y="444" font-size="26" fill="#1d7a3a" text-anchor="start" font-weight="bold">正しい手順</text>
<circle cx="1004" cy="483" r="17" fill="#1d7a3a"/><text x="1004" y="490" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="1034" y="490" font-size="21" fill="#1d2329" text-anchor="start" font-weight="normal">チャックハンドルを抜く</text>
<circle cx="1004" cy="539" r="17" fill="#1d7a3a"/><text x="1004" y="546" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="1034" y="546" font-size="21" fill="#1d2329" text-anchor="start" font-weight="normal">ハンドルを決まった置き場に戻す</text>
<circle cx="1004" cy="595" r="17" fill="#1d7a3a"/><text x="1004" y="602" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="1034" y="602" font-size="21" fill="#1d2329" text-anchor="start" font-weight="normal">周りに人がいないか指差し確認「よし」</text>
<circle cx="1004" cy="651" r="17" fill="#1d7a3a"/><text x="1004" y="658" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="1034" y="658" font-size="21" fill="#1d2329" text-anchor="start" font-weight="normal">回転数つまみが低い位置か確かめる</text>
<circle cx="1004" cy="707" r="17" fill="#1d7a3a"/><text x="1004" y="714" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">5</text><text x="1034" y="714" font-size="21" fill="#1d2329" text-anchor="start" font-weight="normal">主軸を起動する</text>
<rect x="984" y="760" width="0" height="0"/>
<rect x="80" y="804" width="1440" height="120" rx="8" fill="#fff" stroke="#d5dbe0"/>
<rect x="110" y="828" width="380" height="72" rx="12" fill="#fff" stroke="#1f6fb2" stroke-width="3"/><text x="300" y="874" font-size="24" fill="#1f6fb2" text-anchor="middle" font-weight="bold">▶ スロー再生で見る</text>
<rect x="520" y="828" width="560" height="72" rx="12" fill="#1d7a3a"/><text x="800" y="874" font-size="26" fill="#fff" text-anchor="middle" font-weight="bold">もう一度、正しい手順でやる</text>
<text x="1110" y="860" font-size="18" fill="#4a555e" text-anchor="start" font-weight="normal">正しい手順をやり直すと</text><text x="1110" y="888" font-size="18" fill="#4a555e" text-anchor="start" font-weight="normal">このシナリオが終わります</text>
</svg>
